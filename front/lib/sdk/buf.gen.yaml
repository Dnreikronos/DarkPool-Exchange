# Generates the TypeScript SDK from the canonical proto at
# crates/dp-api/proto/darkpool/v1/darkpool.proto.
#
# Run from the front/ workspace: `npm run sdk:gen`
# The npm script cd's into this directory before invoking `buf generate`,
# so all paths below are resolved relative to front/lib/sdk/.
version: v2
inputs:
  - directory: ../../../crates/dp-api/proto
plugins:
  - local: protoc-gen-es
    out: proto
    opt:
      - target=ts
      - import_extension=js
      - json_types=true

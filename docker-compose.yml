# Requires docker compose v2.20+ (uses `depends_on.<svc>.required: false`).
services:
  postgres:
    image: postgres:16-alpine
    container_name: darkpool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darkpool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darkpool}
      POSTGRES_DB: ${POSTGRES_DB:-darkpool}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darkpool} -d ${POSTGRES_DB:-darkpool}"]
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: darkpool-anvil
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 20

  deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: darkpool-deployer
    depends_on:
      anvil:
        condition: service_healthy
    working_dir: /contracts
    user: "0:0"
    volumes:
      - ./contracts:/contracts
      - shared:/shared
    environment:
      PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      FEE_RECIPIENT: ${FEE_RECIPIENT:-0xf39Fd6e51aad88F6F4ce6aB8827279cfFFb92266}
      VK_JSON_PATH: /contracts/test/fixtures/vk.json
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        forge script script/Deploy.s.sol:DeployScript \
          --rpc-url http://anvil:8545 --broadcast 2>&1 | tee /tmp/deploy.log
        DARKPOOL_ADDR=$$(grep -oE 'DarkPool: 0x[a-fA-F0-9]{40}' /tmp/deploy.log | tail -n1 | awk '{print $$2}')
        VERIFIER_ADDR=$$(grep -oE 'VerifierProxy: 0x[a-fA-F0-9]{40}' /tmp/deploy.log | tail -n1 | awk '{print $$2}')
        if [ -z "$$DARKPOOL_ADDR" ] || [ -z "$$VERIFIER_ADDR" ]; then
          echo "failed to parse deploy output; full log:" >&2
          cat /tmp/deploy.log >&2
          exit 1
        fi
        # broadcast/ is written as root (foundry image default); make it host-writable.
        chmod -R a+rwX broadcast 2>/dev/null || true
        printf 'DARKPOOL_CONTRACT_ADDR=%s\n' "$$DARKPOOL_ADDR" > /shared/contracts.env
        echo "deployed -> DarkPool=$$DARKPOOL_ADDR VerifierProxy=$$VERIFIER_ADDR (verifier wired via DarkPool ctor)"
    restart: "no"

  darkpool-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: darkpool-server:dev
    container_name: darkpool-server
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
        required: false
    volumes:
      - shared:/shared:ro
      - zk-keys:/keys:ro
    environment:
      DARKPOOL_GRPC_ADDR: 0.0.0.0:9090
      DARKPOOL_HTTP_ADDR: 0.0.0.0:8080
      DARKPOOL_EVENT_DB: postgres://${POSTGRES_USER:-darkpool}:${POSTGRES_PASSWORD:-darkpool}@postgres:5432/${POSTGRES_DB:-darkpool}
      DARKPOOL_AUCTION_INTERVAL: ${DARKPOOL_AUCTION_INTERVAL:-5s}
      DARKPOOL_ETH_RPC: http://anvil:8545
      DARKPOOL_CHAIN_ID: ${DARKPOOL_CHAIN_ID:-31337}
      DARKPOOL_OPERATOR_KEY: ${DARKPOOL_OPERATOR_KEY:-}
      DARKPOOL_AGGREGATOR_BIN: ${DARKPOOL_AGGREGATOR_BIN:-}
      DARKPOOL_AGGREGATOR_TIMEOUT: ${DARKPOOL_AGGREGATOR_TIMEOUT:-30s}
      DARKPOOL_ZK_PROVING_KEY: ${DARKPOOL_ZK_PROVING_KEY:-}
      DARKPOOL_ZK_BATCH_SIZE: ${DARKPOOL_ZK_BATCH_SIZE:-8}
      DARKPOOL_SUBMIT_TIMEOUT: ${DARKPOOL_SUBMIT_TIMEOUT:-0s}
      DARKPOOL_SUBMIT_GAS: ${DARKPOOL_SUBMIT_GAS:-500000}
      DARKPOOL_API_KEYS: ${DARKPOOL_API_KEYS:-}
      DARKPOOL_RATE_LIMIT: ${DARKPOOL_RATE_LIMIT:-10}
      DARKPOOL_RATE_BURST: ${DARKPOOL_RATE_BURST:-20}
      DARKPOOL_RATE_STALE_AFTER: ${DARKPOOL_RATE_STALE_AFTER:-10m}
      RUST_LOG: ${RUST_LOG:-info,dp_event=debug,dp_engine=info}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        set -a
        . /shared/contracts.env
        set +a
        exec /usr/local/bin/darkpool-server
    ports:
      - "${DARKPOOL_GRPC_PORT:-9090}:9090"
      - "${DARKPOOL_HTTP_PORT:-8080}:8080"

  keygen:
    image: darkpool-server:dev
    container_name: darkpool-keygen
    profiles: ["zk"]
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    volumes:
      - zk-keys:/keys
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /keys/proving_key.bin ]; then
          /usr/local/bin/dp-zk-keygen --out /keys --batch-size ${DARKPOOL_ZK_BATCH_SIZE:-8} --seed ${DARKPOOL_ZK_KEYGEN_SEED:-42}
        else
          echo "keys already present at /keys, skipping keygen"
        fi
    restart: "no"

volumes:
  postgres-data:
  shared:
  zk-keys:

[package]
name = "dp-zk"
version = "0.1.0"
edition = "2021"

[features]
default = ["ivc"]
ivc = ["dep:ark-grumpkin", "dep:folding-schemes", "dep:uuid"]
# Demo/fixture-only helpers: per-proof setup that emits a prover-chosen VK.
# Never enabled by production library or WASM builds (issue #212).
fixtures = []

[dependencies]
ark-ff = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-relations = { workspace = true, features = ["std"] }
ark-r1cs-std = { workspace = true, features = ["std"] }
ark-snark = { workspace = true }
ark-bn254 = { workspace = true, features = ["std"] }
ark-grumpkin = { workspace = true, optional = true }
ark-crypto-primitives = { workspace = true, features = ["std", "sponge", "constraints"] }
ark-groth16 = { workspace = true, features = ["std"] }
folding-schemes = { workspace = true, optional = true }
dp-poseidon = { path = "../dp-poseidon" }

uuid = { workspace = true, optional = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "ivc"
path = "tests/ivc.rs"
harness = true
required-features = ["ivc"]

[package]
name = "dp-zk-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dp-zk-cli"
path = "src/bin/dp-zk-cli.rs"

[[bin]]
name = "dp-aggregator"
path = "src/bin/dp-aggregator.rs"

[dependencies]
dp-zk = { path = "../dp-zk" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
hex = { workspace = true }
k256 = "0.13"
rand = "0.8"
ark-bn254 = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-crypto-primitives = { workspace = true, features = ["std", "sponge"] }
ark-std = { workspace = true, features = ["std", "getrandom"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-snark = { workspace = true }

[features]
# Demo/fixtures-only subcommands (prove-single-order) that pull dp-zk's
# unsound per-proof setup. Off by default, so default and whole-workspace
# builds keep that path out of every production artifact (issue #212).
fixtures = ["dp-zk/fixtures"]

[dev-dependencies]
tempfile = "3"
insta = "1"

[package]
name = "dp-zk-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dp-zk-cli"
path = "src/bin/dp-zk-cli.rs"

[[bin]]
name = "dp-zk-keygen"
path = "src/bin/dp-zk-keygen.rs"

[[bin]]
name = "dp-zk-vk-export"
path = "src/bin/dp-zk-vk-export.rs"

[[bin]]
name = "dp-zk-fixture-gen"
path = "src/bin/dp-zk-fixture-gen.rs"

[[bin]]
name = "dp-aggregator"
path = "src/bin/dp-aggregator.rs"

[[bin]]
name = "dp-zk-rotate-key"
path = "src/bin/dp-zk-rotate-key.rs"

[dependencies]
dp-zk = { path = "../dp-zk" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
hex = { workspace = true }
k256 = "0.13"
rand = "0.8"
ark-bn254 = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std", "getrandom"] }
ark-groth16 = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-snark = { workspace = true }

[dev-dependencies]
tempfile = "3"

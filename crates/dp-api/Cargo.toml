[package]
name = "dp-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "darkpool-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
dp-types       = { path = "../dp-types" }
dp-event       = { path = "../dp-event", features = ["postgres"] }
dp-engine      = { path = "../dp-engine" }
dp-crypto      = { path = "../dp-crypto" }
dp-aggregator  = { path = "../dp-aggregator" }
dp-settlement  = { path = "../dp-settlement" }

tonic = { workspace = true, features = ["tls"] }
prost.workspace = true
axum-server.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
http.workspace = true
http-body.workspace = true
humantime.workspace = true
futures-util.workspace = true
sha2 = { workspace = true }

[dev-dependencies]
alloy-primitives.workspace = true
hex.workspace = true
http-body-util.workspace = true
serial_test.workspace = true
tempfile = "3"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
tokio-rustls.workspace = true
k256 = "0.13"
rand = "0.8"
ecies = { workspace = true }

[build-dependencies]
tonic-build.workspace = true

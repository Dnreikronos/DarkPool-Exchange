syntax = "proto3";

package darkpool.v1;

// Retained for cross-language codegen parity (Go SDK, gateway tooling); ignored by tonic-build.
option go_package = "github.com/darkpool-exchange/server/api/gen/darkpool/v1;darkpoolv1";

import "google/api/annotations.proto";

service DarkPoolService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }

  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (google.api.http) = {
      delete: "/v1/orders/{order_id}"
    };
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/v1/orders/{order_id}"
    };
  }

  // Lists the authenticated caller's own resting orders ("my orders").
  // Scoped to the wallet identity; a trader never sees another trader's
  // orders. There is deliberately no public pre-settlement order book —
  // serving live cross-trader depth would defeat the dark pool (an
  // observer could reconstruct incoming liquidity and cross it in the
  // same auction round).
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/orders"
    };
  }

  rpc GetAuctionHistory(GetAuctionHistoryRequest) returns (GetAuctionHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/auctions"
    };
  }

  rpc StreamAuctions(StreamAuctionsRequest) returns (stream AuctionEvent) {}

  // Public discovery surface: lists active pairs only.
  rpc ListPairs(ListPairsRequest) returns (ListPairsResponse) {
    option (google.api.http) = {
      get: "/v1/pairs"
    };
  }
}

// Operator-only administration. Gated by a separate API-key set
// (DARKPOOL_OPERATOR_API_KEYS) so trader credentials cannot mutate the
// pair registry.
service DarkPoolAdminService {
  rpc RegisterPair(RegisterPairRequest) returns (RegisterPairResponse) {
    option (google.api.http) = {
      post: "/v1/admin/pairs"
      body: "*"
    };
  }

  rpc SuspendPair(SuspendPairRequest) returns (SuspendPairResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/pairs/{pair}/suspend"
      body: "*"
    };
  }

  rpc DelistPair(DelistPairRequest) returns (DelistPairResponse) {
    option (google.api.http) = {
      delete: "/v1/admin/pairs/{pair}"
    };
  }

  rpc ListPairsAdmin(ListPairsAdminRequest) returns (ListPairsAdminResponse) {
    option (google.api.http) = {
      get: "/v1/admin/pairs"
    };
  }
}

// --- Place Order ---

// PlaceOrderRequest carries only the encrypt-only trio. The engine never
// sees plaintext on the wire; the operator decrypts server-side.
//
// NOTE (issue #158): `commitment` and `proof` are NOT cryptographically
// verified today. The engine ignores the client commitment and re-derives
// the canonical Poseidon commitment over the decrypted fields; the proof is
// accepted unverified. Order validity is operator-enforced, not
// proof-enforced. A verified per-order proof is deferred to ADR 0001 /
// issues #97-#98. Do not treat these two fields as a cryptographic guarantee.
//
// Both fields are still SYNTACTICALLY required: `validate_place_order`
// rejects an empty `commitment` or `proof`. Until real verification lands,
// clients must keep sending non-empty bytes for both (placeholder bytes are
// fine — they are not checked, only their presence is).
message PlaceOrderRequest {
  bytes commitment        = 1; // client commitment; re-derived & overridden server-side (unverified)
  bytes proof             = 2; // per-order ZK proof; ACCEPTED UNVERIFIED (see note)
  bytes encrypted_payload = 3; // opaque ciphertext to operator pubkey
}

message PlaceOrderResponse {
  OrderInfo order = 1;
}

// --- Cancel Order ---

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
}

message CancelOrderResponse {}

// --- Get Order ---

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  OrderInfo order = 1;
}

// --- List Orders (caller-scoped "my orders") ---

message ListOrdersRequest {
  string pair = 1;  // optional filter; empty = every pair
}

message ListOrdersResponse {
  repeated OrderInfo orders = 1;
}

// --- Auction History ---

message GetAuctionHistoryRequest {
  string pair = 1;
  int32 limit = 2;  // 0 = default (50)
}

message GetAuctionHistoryResponse {
  repeated AuctionSummary auctions = 1;
}

message AuctionSummary {
  string auction_id = 1;
  string pair = 2;
  string clearing_price = 3;
  string matched_volume = 4;
  int32 match_count = 5;
  int64 timestamp_unix = 6;
}

// --- Stream Auctions ---

message StreamAuctionsRequest {
  string pair = 1;  // empty = all pairs
}

message AuctionEvent {
  string auction_id = 1;
  string pair = 2;
  string clearing_price = 3;
  string matched_volume = 4;
  int32 match_count = 5;
  int64 timestamp_unix = 6;
}

// --- Shared types ---

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

message OrderInfo {
  string id = 1;
  string pair = 2;
  Side side = 3;
  string price = 4;
  string size = 5;
  string remaining_size = 6;
  string commitment_key = 7;
  int64 submitted_at_unix = 8;
  int64 expires_at_unix = 9;
}

// --- Pair registry ---

enum PairStatus {
  PAIR_STATUS_UNSPECIFIED = 0;
  PAIR_STATUS_ACTIVE = 1;
  PAIR_STATUS_SUSPENDED = 2;
  PAIR_STATUS_DELISTED = 3;
}

message PairInfo {
  string pair = 1;
  string base_token = 2;
  string quote_token = 3;
  string min_order_size = 4;
  string tick_size = 5;
  optional uint32 auction_interval_ms = 6;
  PairStatus status = 7;
}

message ListPairsRequest {}

message ListPairsResponse {
  repeated PairInfo pairs = 1;
}

message ListPairsAdminRequest {}

message ListPairsAdminResponse {
  repeated PairInfo pairs = 1;
}

message RegisterPairRequest {
  string pair = 1;
  string base_token = 2;
  string quote_token = 3;
  string min_order_size = 4;
  string tick_size = 5;
  optional uint32 auction_interval_ms = 6;
}

message RegisterPairResponse {
  PairInfo pair = 1;
}

message SuspendPairRequest {
  string pair = 1;
}

message SuspendPairResponse {}

message DelistPairRequest {
  string pair = 1;
}

message DelistPairResponse {
  uint32 cancelled_orders = 1;
}

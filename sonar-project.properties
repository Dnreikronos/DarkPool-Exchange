sonar.projectKey=Dnreikronos_DarkPool-Exchange
sonar.organization=dnreikronos
sonar.host.url=https://sonarcloud.io

sonar.sources=crates
sonar.tests=crates
sonar.source.inclusions=**/src/**/*.rs
sonar.test.inclusions=**/tests/**/*.rs
sonar.exclusions=**/target/**,contracts/**,**/proto/**,**/build.rs

sonar.coverageReportPaths=coverage/sonar-coverage.xml

# Trivial process-IO shims — `fn main() { dp_zk_cli::run_prover_cli(...) }`
# plus the wrappers that lock real stdin/stdout/clap. No logic to test in
# isolation; the prove pipeline they wrap is covered via run_prover_io and
# prove_from_bytes tests in lib.rs.
sonar.coverage.exclusions=crates/dp-zk-cli/src/bin/**,crates/dp-zk-cli/src/cli.rs

sonar.cpd.minimumTokens=50
sonar.cpd.minimumLines=10

sonar.scm.provider=git

sonar.projectKey=Dnreikronos_DarkPool-Exchange
sonar.organization=dnreikronos
sonar.host.url=https://sonarcloud.io

sonar.sources=crates
sonar.tests=crates
sonar.source.inclusions=**/src/**/*.rs
sonar.test.inclusions=**/tests/**/*.rs
sonar.exclusions=**/target/**,contracts/**,**/proto/**,**/build.rs

sonar.coverageReportPaths=coverage/sonar-coverage.xml

# Trivial process-IO shims — `fn main() { dp_zk_cli::run_prover_cli(...) }`
# plus the wrappers that lock real stdin/stdout/clap. No logic to test in
# isolation; the prove pipeline they wrap is covered via run_prover_io and
# prove_from_bytes tests in lib.rs.
#
# Additional excluded files:
# - crates/dp-api/src/main.rs — `#[tokio::main]` server bootstrap. Helpers
#   (sanitize_db_url, validate_zk_key_dir, seed_pairs_from_json) have unit
#   tests; the remaining lines are integration glue (signal handlers,
#   task spawning, graceful shutdown) covered end-to-end by the
#   integration test binaries and not meaningfully testable in isolation.
# - crates/dp-event/src/pg_store.rs — requires a live Postgres instance.
#   Exercised by tests/pg_store.rs which is gated on a runtime DATABASE_URL
#   and runs in CI separately, not via the standard `cargo test` LCOV pass.
# - crates/dp-event/src/pg_snapshot.rs — same as pg_store.rs: all methods
#   require a live Postgres connection via sqlx. Exercised by the same
#   DATABASE_URL-gated CI job, not the standard `cargo test` LCOV pass.
# - crates/dp-engine/benches/recover.rs — criterion benchmark. Not compiled
#   or executed by `cargo test`; coverage tooling never instruments it.
# - crates/dp-api/src/observability.rs — installs process-global metrics +
#   tracing subscribers. The env-resolution helpers are extracted and unit
#   tested; the remaining lines wire up the actual OTLP exporter / batch
#   provider, which need a live OTel collector to drive coverage.
sonar.coverage.exclusions=crates/dp-zk-cli/src/bin/**,crates/dp-zk-cli/src/cli.rs,crates/dp-api/src/main.rs,crates/dp-event/src/pg_store.rs,crates/dp-api/src/observability.rs,crates/dp-event/src/pg_snapshot.rs,crates/dp-engine/benches/recover.rs

# dp-client/src/commitment.rs is an intentional verbatim copy of
# dp-zk/src/commitment.rs kept separate to avoid pulling ark-groth16 / rayon
# into the WASM build. Exclude it from CPD so the canonical source in dp-zk
# is not penalised for the deliberate duplication.
sonar.cpd.exclusions=crates/dp-client/src/commitment.rs

sonar.cpd.minimumTokens=50
sonar.cpd.minimumLines=10

sonar.scm.provider=git

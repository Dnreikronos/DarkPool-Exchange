[workspace]
resolver = "2"
members = [
    "crates/dp-types",
    "crates/dp-crypto",
    "crates/dp-event",
    "crates/dp-book",
    "crates/dp-auction",
    "crates/dp-aggregator",
    "crates/dp-settlement",
    "crates/dp-engine",
    "crates/dp-api",
]

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
ecies = { version = "0.2", default-features = false, features = ["pure"] }
bincode = "1"
tokio-util = { version = "0.7", features = ["rt"] }
alloy-primitives = "1"
alloy-sol-types = "1"
alloy-provider = { version = "1", features = ["ws"] }
alloy-signer-local = "1"
alloy-network = "1"
alloy-contract = "1"
alloy-rpc-types = "1"
alloy-transport = "1"
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["limit"] }
base64 = "0.22"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
http = "1"
http-body = "1"
http-body-util = "0.1"
humantime = "2"
futures-util = "0.3"
serial_test = "3"

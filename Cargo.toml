[workspace]
resolver = "2"
members = [
    "crates/dp-types",
    "crates/dp-crypto",
    "crates/dp-event",
    "crates/dp-book",
    "crates/dp-auction",
    "crates/dp-aggregator",
    "crates/dp-settlement",
    "crates/dp-engine",
    "crates/dp-api",
]

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
